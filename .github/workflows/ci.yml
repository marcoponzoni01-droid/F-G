name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Nothing here publishes anything. Hosting is deliberately not chosen yet —
# see docs/DEPLOYING.md for the two ready-to-use options.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types plus every issue's frontmatter against the schema in
      # src/content.config.ts — a bad region or a missing dek fails here.
      - name: Typecheck and validate content
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run check:links

      # Numbering, charts, the market panel's week-to-week arithmetic, the
      # prev/next chain and the archive facets — the things that stay silently
      # wrong rather than failing the build.
      - name: Check content invariants
        run: npm run check:content

      # site/index.html is the single canonical file that goes to Claude
      # Design and comes back. These guard the properties whose failure is
      # silent: views shipping hidden (the file then reads as blank to
      # anything that does not run scripts, which is how a hand-off lost
      # twelve of thirteen pages), missing merge hooks, and an unparseable
      # search index.
      - name: Check the canonical site file
        run: npm run check:site

      # A no-op import must be byte identical, and a partial return must leave
      # the other views alone. Python only, no browser.
      - name: Check the Design round trip
        run: npm run check:roundtrip

      # Proves the site still works when served from a subpath, so choosing
      # GitHub Pages later stays a one-variable change rather than a refactor.
      - name: Build for a subpath (host-portability check)
        env:
          SITE_URL: https://example.github.io
          BASE_PATH: /F-G
        run: |
          npm run build
          npm run check:links
